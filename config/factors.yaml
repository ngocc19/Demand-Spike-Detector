  sources:
    van_mieu:
      enabled: true
      endpoint: https://vanmieu.gov.vn/api/events
      listing_url: https://vanmieu.gov.vn/vi/events/cultural-events
      resolve_article_urls: true
      article_listing_urls:
        cultural: https://vanmieu.gov.vn/vi/events/cultural-events
        workshop: https://vanmieu.gov.vn/vi/events/workshop
        diplomatic: https://vanmieu.gov.vn/vi/events/diplomatic
        seminar: https://vanmieu.gov.vn/vi/events/conferences
      article_listing_max_pages: 20
      locale: vi
      limit: 100
      max_pages: 20
      timeout_seconds: 30
      max_retries: 3
      watermark_overlap_minutes: 10
      full_scan_every_runs: 4
      user_agent: DemandSpikeDetector/0.1
      scope_city: hanoi
    vpf_football:
      enabled: true
      calendars:
        v_league_1_2025_26: https://vpf.vn/season/v-league-2026/?action=calendar&pagejs=1
        national_cup_2025_26: https://vpf.vn/season/cup-quoc-gia-2026/?action=calendar&pagejs=1
        v_league_1_2026_27: https://vpf.vn/season/v-league-2027/?action=calendar&pagejs=1
        v_league_2_2026_27: https://vpf.vn/season/hang-nhat-quoc-gia-2027/?action=calendar&pagejs=1
        national_cup_2026_27: https://vpf.vn/season/cup-quoc-gia-2027/?action=calendar&pagejs=1
      hanoi_venue_allowlist:
        - SVD Hang Day
        - SVD My Dinh
      timezone: Asia/Ho_Chi_Minh
      default_duration_minutes: 120
      timeout_seconds: 30
      max_retries: 3
      user_agent: DemandSpikeDetector/0.1
      scope_city: hanoi
    vff_football:
      enabled: true
      listing_url: https://vff.org.vn/chuyen-muc/tin-tuc/thong-tin-ve/
      max_listing_pages: 8
      timezone: Asia/Ho_Chi_Minh
      default_duration_minutes: 120
      timeout_seconds: 30
      max_retries: 3
      full_scan_every_runs: 4
      user_agent: DemandSpikeDetector/0.1
      scope_city: hanoi
    ticketbox_concert:
      enabled: true
      search_url: https://api-v2.ticketbox.vn/search/v2/events
      category: music
      from_date: "2026-06-29"
      to_date: "2026-09-28"
      page_size: 100
      max_pages: 5
      timezone: Asia/Ho_Chi_Minh
      timeout_seconds: 30
      max_retries: 3
      full_scan_every_runs: 4
      user_agent: DemandSpikeDetector/0.1
      scope_city: hanoi
    ticketbox_festival:
      enabled: true
      search_url: https://api-v2.ticketbox.vn/search/v2/events
      from_date: "2026-06-29"
      to_date: "2026-09-28"
      page_size: 100
      max_pages: 5
      timezone: Asia/Ho_Chi_Minh
      timeout_seconds: 30
      max_retries: 3
      full_scan_every_runs: 4
      user_agent: DemandSpikeDetector/0.1
      scope_city: hanoi
    lehoivietnam_hanoi:
      enabled: true
      listing_url: https://lehoivietnam.com.vn/vi/kham-pha?tag_key=place%3Aha-noi
      max_pages: 20
      timezone: Asia/Ho_Chi_Minh
      timeout_seconds: 30
      full_scan_every_runs: 4
      user_agent: DemandSpikeDetector/0.1
      scope_city: hanoi
    official_hanoi_other:
      enabled: true
      listing_sources:
        - name: Hanoi Department of Education and Training
          listing_url: https://www.hanoi.edu.vn/
          allowed_hosts: [www.hanoi.edu.vn, hanoi.edu.vn]
          keywords: ["khai giảng", "tựu trường", "workshop", "hội thảo", "tập huấn"]
          excluded_title_prefixes: ["v/v", "công văn", "thông báo"]
      timezone: Asia/Ho_Chi_Minh
      default_duration_minutes: 180
      timeout_seconds: 30
      full_scan_every_runs: 4
      user_agent: DemandSpikeDetector/0.1
      scope_city: hanoi

# ============================================================
# FACTORS (from feature/data-pipeline)
# ============================================================
factors:
  - name: here_traffic
    type: api
    source: here
    schedule: "*/30 * * * *"
    enabled: true
    config:
      api_key_env: HERE_API_KEY
      data_lake_dir: "data/traffic"
      cache_ttl_minutes: 15

  - name: weather
    type: api
    source: open_meteo
    schedule: "0 * * * *"
    enabled: true
    config:
      latitude: 21.0285
      longitude: 105.8542
      radius_km: 30
      timezone: "Asia/Ho_Chi_Minh"
      forecast_days: 7
      past_days: 0

  - name: flood
    type: rss
    source: vnexpress_rss
    schedule: "*/15 * * * *"
    enabled: true
    config:
      rss_sources:
        - "https://vnexpress.net/rss/thoi-su.rss"
      max_entries: 50
      max_age_hours: 24
      geocoding_api: nominatim
      latitude: 21.0285
      longitude: 105.8542

  - name: event
    type: csv
    source: manual
    schedule: "0 23 * * *"
    enabled: true
    config:
      csv_path: "data/events.csv"
      impact_radius: 3
      venue_coords:
        svd_my_dinh: [21.0285, 105.8195]
        thong_nhat: [10.7795, 106.7312]
        arena: [21.0065, 105.8195]
        ice: [21.0150, 105.7850]

  - name: holiday
    type: file
    source: static
    schedule: "0 0 1 1 *"
    enabled: true
    config:
      holiday_file: "data/holidays.csv"
      tet_date: "2025-01-29"
      impact_radius: 50

backfill:
  weather:
    past_days: 60
  flood:
    use_wayback_machine: true
    max_archive_days: 90
  events:
    manual_collection: true
  holidays:
    include_tet_phases: true
