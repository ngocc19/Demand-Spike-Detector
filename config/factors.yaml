      type_values: [festival, festival_public]
      keywords: [lễ hội, festival, ngày hội, hội xuân]
    exhibition:
      type_values: [exhibition]
      keywords: [triển lãm, trưng bày, exhibition]
    other:
      type_values: []
      keywords: []
  event_date_window:
    start_date: "2026-06-29"
    end_date: "2026-09-28"
  attendance_estimation:
    fill_missing_with_heuristic: false
    reported_attendance_overrides:
      - source: vff_football
