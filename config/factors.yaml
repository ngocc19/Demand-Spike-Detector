pipeline:
  city: hanoi
  timezone: Asia/Ho_Chi_Minh
  data_dir: data

# ============================================================
# EVENT CONFIGURATION (from feature/event_slot)
# ============================================================
events:
  csv_output_file: event.csv
  workbook_output_file: events.xlsx
  sheet_classification:
    football:
      type_values: [football]
      keywords: []
    concert:
      type_values: [concert, music_concert]
      keywords:
        - concert
        - live show
        - liveshow
        - âm nhạc
        - music
        - sơn tùng
        - hòa minzy
        - anh trai say hi
        - âm thanh vượt đại dương
